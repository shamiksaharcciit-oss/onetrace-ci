name: "onetrace-ci gate"
description: >
  Runs the onetrace-ci gate against a run and its baseline, appends the
  verdict to the job summary, and uploads the run/report directories as an
  artifact. Phase 1 only: no PR comment, no SARIF -- both need write
  permissions a fork PR does not have. Needs only `contents: read`.
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  run:
    description: "Path to the run folder to gate."
    required: true
  baseline:
    description: "Path to the committed baseline run folder."
    required: true
  plan:
    description: "Path to onetrace-plan.yaml."
    required: true
  runner:
    description: "Path to a runner declaration (onetrace-runner/0.1), if plan.reproduce is true."
    required: false
    default: ""
  out:
    description: "Directory for verdict.json, summary.md, and the diff/localize/reproduce reports."
    required: false
    default: "onetrace-ci-out"
  review-exit:
    description: "0 or 2. 2 (default) makes a review-required verdict fail the job; 0 makes it advisory."
    required: false
    default: "2"
  python-version:
    description: "Python version to run onetrace-ci with."
    required: false
    default: "3.12"

outputs:
  exit-code:
    description: "The gate's own exit code: 0 pass, 1 fail, 2 review required."
    value: ${{ steps.gate.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install onetrace-ci (pinned by hash)
      shell: bash
      run: |
        python -m pip install --require-hashes -r "${{ github.action_path }}/requirements.lock"
        python -m pip install --no-deps -e "${{ github.action_path }}"

    - name: Run the gate
      id: gate
      shell: bash
      run: |
        set +e
        RUNNER_ARG=""
        if [ -n "${{ inputs.runner }}" ]; then
          RUNNER_ARG="--runner ${{ inputs.runner }}"
        fi
        onetrace-ci gate --run "${{ inputs.run }}" --baseline "${{ inputs.baseline }}" \
          --plan "${{ inputs.plan }}" $RUNNER_ARG --out "${{ inputs.out }}" \
          --review-exit "${{ inputs.review-exit }}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        cat "${{ inputs.out }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
        exit $code

    - name: Upload the gate's own run and reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: onetrace-ci-gate-output
        path: |
          ${{ inputs.run }}
          ${{ inputs.out }}
        if-no-files-found: warn
